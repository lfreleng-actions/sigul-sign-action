# Path-specific configurations.
paths:
  .github/workflows/openssf-scorecard.yaml:
    ignore:
      # This fork of actionlint adds a cache-access policy check that
      # upstream v1.7.12 does not have. It wants 'cache-mode: read' or
      # 'cache-mode: none' on reusable workflow calls made under a
      # low-trust trigger, here branch_protection_rule.
      #
      # GitHub shipped 'cache-mode' on 2026-09-10 and SchemaStore's
      # workflow schema already models it, on both job kinds and at
      # workflow level. check-jsonschema 0.38.0, the newest release,
      # vendors an older copy, so adding the key fails the
      # check-github-workflows hook at both job level ('runs-on' is a
      # required property) and workflow level ('Additional properties
      # are not allowed'). Suppress the lint rather than write a key
      # that another mandatory hook rejects.
      #
      # Remove this entry once a check-jsonschema release vendors a
      # schema containing 'cache-mode', then set 'cache-mode: read' on
      # the job.
      #
      # Scoped to this one callee so that any other reusable workflow
      # call added to this file must account for cache access on its
      # own merits. The pinned SHA is deliberately left as [0-9a-f]{40}
      # rather than written out: Dependabot rotates it, and naming it
      # here would fail the lint on every bump.
      # yamllint disable-line rule:line-length
      - 'reusable workflow call "lfit/releng-reusable-workflows/\.github/workflows/reuse-openssf-scorecard\.yaml@[0-9a-f]{40}" has no explicit cache access limit'

  .github/workflows/testing.yaml:
    ignore:
      # Ignore deliberate test failure
      - 'input "invalid_input" is not defined in action .+'
      - 'missing input "input" which is required by action .+'
      # GitHub introduced the self-repository 'uses: $/...' syntax in
      # July 2026, and zizmor's self-repository audit (v1.30.0+) reports
      # the older workspace-relative './' form as a finding. This fork of
      # actionlint understands '$/{path}', but deliberately rejects a
      # bare '$/' because actions/runner's TryParseSelfRepository helper
      # refuses an empty path. GitHub's server-side workflow parser does
      # accept it: an action at the repository root has no {path}, and a
      # bare '$/' resolves and runs. This ignore holds the line for that
      # one case, which applies to every action living at its repository
      # root.
      #
      # Note 'path is missing' rather than upstream v1.7.12's 'ref is
      # missing': this fork reports the bare case differently. The
      # closing quote sits immediately after '$/', so malformed
      # extra-slash forms such as '$//' are still reported.
      - 'specifying action "\$/" in invalid format because path is missing'
