---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Live signing test, against real Sigul infrastructure.
#
# Run by hand from the Actions tab. It signs a throwaway file, or a
# throwaway tag that is never pushed, with real credentials, which
# the testing workflow cannot: there, no bridge is ever contacted.
#
# 'Dry run' is ticked by default. A dry run does everything short of
# signing -- it pulls the image, decrypts the credentials, has the
# Sigul client load its configuration, NSS database and certificate,
# and resolves the bridge without connecting. It still decrypts real
# credentials and runs the selected image, so requires a trusted job.
# Untick it to sign and verify against the expected public key.
#
# CREDENTIALS. Each infrastructure has its own environment, which also
# carries any protection rules (required reviewers, say):
#
#   sigul-legacy   the CentOS 7 bridges, e.g. ONAP's credentials
#   sigul-modern   the sigul-docker-k8s stack, e.g. OpenSearch's
#
# Each environment holds the secrets the action takes, under the names
# lfit/releng-reusable-workflows uses:
#
#   SIGUL_KEY    key name (or set it as a variable instead)
#   SIGUL_CONF   client.conf, with any Jenkins $SIGUL_CONFIG_* filled in
#   SIGUL_PASS   key passphrase, which also decrypts SIGUL_PKI
#   SIGUL_PKI    the encrypted PKI bundle
#   SIGUL_IP     optional: with SIGUL_URI, a hosts entry for the bridge
#   SIGUL_URI    required here for the egress policy; may be a variable
#               instead of a secret. Must name one approved bridge below;
#               expected-bridge checks the effective configuration after
#               the bundle's user configuration overrides SIGUL_CONF.
#
# A non-dry run also requires SIGUL_PUBLIC_KEY as a variable: the trusted
# signing key's armoured public half, against which signatures are verified.
name: "Live signing 🔏"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      container:
        description: "Signing infrastructure, and its environment"
        type: choice
        options: ["legacy", "modern"]
        default: "legacy"
      allow-legacy:
        description: "Accept the unsupported legacy client for this run"
        type: boolean
        default: false
      operation:
        description: "What to sign"
        type: choice
        options: ["sign-data", "sign-git-tag"]
        default: "sign-data"
      dry-run:
        description: "Dry run: check everything, sign nothing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  live:
    # yamllint disable-line rule:line-length
    name: "${{ inputs.dry-run && 'Dry run' || 'Sign' }}: ${{ inputs.operation }} (${{ inputs.container }})"
    # amd64, which the legacy client image requires.
    runs-on: ubuntu-24.04
    environment: "sigul-${{ inputs.container }}"
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      BRIDGE_HOST: ${{ secrets.SIGUL_URI || vars.SIGUL_URI }}
    steps:
      # The firewall starts in a pre hook, before checkout. Keep its policy
      # inline: the organisation loader adds unrelated publishing endpoints.
      # Admit HTTPS checkout, the selected registry, and one approved bridge.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >-
            github.com:443
            ${{ inputs.container == 'modern' &&
                'ghcr.io:443 pkg-containers.githubusercontent.com:443' || '' }}
            ${{ inputs.container == 'legacy' &&
                'auth.docker.io:443 registry-1.docker.io:443' || '' }}
            ${{ inputs.container == 'legacy' &&
                'production.cloudflare.docker.com:443' || '' }}
            ${{ inputs.container == 'legacy' &&
                'production.cloudfront.docker.com:443' || '' }}
            ${{ inputs.container == 'legacy' &&
                (env.BRIDGE_HOST ==
                  'sigul-bridge-yul.linuxfoundation.org' ||
                 env.BRIDGE_HOST ==
                  'sigul-bridge-us-west-2.linuxfoundation.org') &&
                format('{0}:44334', env.BRIDGE_HOST) || '' }}
            ${{ inputs.container == 'modern' &&
                env.BRIDGE_HOST == 'sigul-bridge.opensearch.org' &&
                'sigul-bridge.opensearch.org:44334' || '' }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Require the expected public key"
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.SIGUL_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_KEY//[[:space:]]/}" ]; then
            echo "::error::Set SIGUL_PUBLIC_KEY before a non-dry signing run"
            exit 1
          fi

      - name: "Check the selected bridge"
        shell: bash
        env:
          CONTAINER: ${{ inputs.container }}
        run: |
          set -euo pipefail
          case "${CONTAINER}:${BRIDGE_HOST}" in
            legacy:sigul-bridge-yul.linuxfoundation.org | \
            legacy:sigul-bridge-us-west-2.linuxfoundation.org | \
            modern:sigul-bridge.opensearch.org) ;;
            *)
              echo "::error::SIGUL_URI does not match the selected client"
              exit 1
              ;;
          esac

      - name: "Make something to sign"
        id: target
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${OPERATION}" = "sign-data" ]; then
            mkdir -p live-signing
            printf 'sigul-sign-action live test\nrun %s\ncommit %s\n' \
              "${RUN_ID}" "${SHA}" > live-signing/payload.txt
            echo "object=live-signing/payload.txt" >> "$GITHUB_OUTPUT"
          else
            # A local tag only: push-tag is off below, so nothing
            # leaves the runner.
            tag="sigul-live-test-${RUN_ID}"
            git -c user.name="sigul-sign-action" \
              -c user.email="releng@linuxfoundation.org" \
              -c tag.gpgSign=false \
              tag -a "${tag}" -m "Live signing test, run ${RUN_ID}"
            echo "object=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Sign with Sigul"
        id: sign
        uses: $/
        with:
          container: ${{ inputs.container }}
          allow-legacy: ${{ inputs.allow-legacy }}
          sign-type: ${{ inputs.operation }}
          sign-object: ${{ steps.target.outputs.object }}
          push-tag: "false"
          dry-run: ${{ inputs.dry-run }}
          sigul-key-name: ${{ secrets.SIGUL_KEY || vars.SIGUL_KEY }}
          sigul-conf: ${{ secrets.SIGUL_CONF }}
          sigul-pass: ${{ secrets.SIGUL_PASS }}
          sigul-pki: ${{ secrets.SIGUL_PKI }}
          sigul-ip: ${{ secrets.SIGUL_IP }}
          sigul-uri: ${{ env.BRIDGE_HOST }}
          expected-bridge: ${{ format('{0}:44334', env.BRIDGE_HOST) }}

      - name: "Verify the signature"
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          OBJECT: ${{ steps.target.outputs.object }}
          PUBLIC_KEY: ${{ vars.SIGUL_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_KEY//[[:space:]]/}" ]; then
            echo "::error::SIGUL_PUBLIC_KEY is required to verify the signature"
            exit 1
          fi
          if [ "${OPERATION}" = "sign-git-tag" ]; then
            git cat-file tag "refs/tags/${OBJECT}" |
              grep -q "BEGIN PGP SIGNATURE" ||
              { echo "::error::the tag carries no signature"; exit 1; }
          fi

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d /tmp/verify.XXXXXX)"
          printf '%s\n' "${PUBLIC_KEY}" | gpg --batch --quiet --import
          if [ "${OPERATION}" = "sign-data" ]; then
            gpg --batch --verify "${OBJECT}.asc" "${OBJECT}"
            # Only after verification, and indented rather than fenced:
            # armour headers sit outside the signed data, so a fence could
            # still be closed from inside a verified file. Markdown also
            # ends a line at a bare CR, so split those before indenting.
            {
              printf '### Signature\n\n'
              tr '\r' '\n' < "${OBJECT}.asc" | sed 's/^/    /'
              printf '\n'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git verify-tag "${OBJECT}"
          fi
          echo "Signature verified against SIGUL_PUBLIC_KEY ✅" |
            tee -a "$GITHUB_STEP_SUMMARY"
