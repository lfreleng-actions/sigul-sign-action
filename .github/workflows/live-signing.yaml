---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Live signing test, against real Sigul infrastructure.
#
# Run by hand from the Actions tab. It signs a throwaway file, or a
# throwaway tag that is never pushed, with real credentials, which
# the testing workflow cannot: there, no bridge is ever contacted.
#
# 'Dry run' is ticked by default. A dry run does everything short of
# signing -- it pulls the image, decrypts the credentials, has the
# Sigul client load its configuration, NSS database and certificate,
# and resolves the bridge without connecting. It still decrypts real
# credentials and runs the selected image, so requires a trusted job.
# Untick it to sign and verify against the expected public key.
#
# CREDENTIALS. Each project has its own environment -- onap,
# opendaylight, o-ran-sc and opensearch -- which admits only the main
# branch and carries any other protection rules. Pick one with the
# 'project' input. Each environment holds:
#
#   SIGUL_CREDENTIALS  secret: base64 of the compact JSON document
#                      {"version":1,"config":<base64 client.conf>,
#                       "password":<one line>,"pki":<base64 armoured
#                       bundle>}; every field is masked before use
#   SIGUL_KEY          variable: the signing key name
#   SIGUL_URI          variable: the bridge host name, no port. Must name
#                      one approved bridge below; expected-bridge checks
#                      the effective configuration after the bundle's
#                      user configuration overrides client.conf.
#   SIGUL_PUBLIC_KEY   variable: the trusted signing key's armoured public
#                      half. A non-dry run requires it and verifies the
#                      signature against it.
#
# The repository variable SIGUL_LIVE_PROJECTS, a JSON object keyed by
# environment name, gives each project's client as its 'container':
# 'legacy' or 'modern'. Listing a project as legacy records its approved
# unsupported-client exception, so it also sets allow-legacy. This
# manual workflow ignores the object's 'enabled' flag.
#
# Sigul's client fails on a bridge name that resolves to several
# addresses (lfreleng-actions/sigul-docker-k8s#102), so the workflow pins
# the name to the first address that accepts a connection and passes it
# to the action as a hosts entry. That check opens a TCP connection to
# the bridge, dry run or not. This is interim, until the action does it
# itself (lfreleng-actions/sigul-sign-action#32).
name: "Live signing 🔏"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project, and its environment"
        type: choice
        options: ["onap", "opendaylight", "o-ran-sc", "opensearch"]
        default: "onap"
      operation:
        description: "What to sign"
        type: choice
        options: ["sign-data", "sign-git-tag"]
        default: "sign-data"
      dry-run:
        description: "Dry run: check everything, sign nothing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  live:
    # yamllint disable-line rule:line-length
    name: "${{ inputs.dry-run && 'Dry run' || 'Sign' }}: ${{ inputs.operation }} (${{ inputs.project }})"
    # amd64, which the legacy client image requires.
    runs-on: ubuntu-24.04
    environment: ${{ inputs.project }}
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      BRIDGE_HOST: ${{ vars.SIGUL_URI }}
      # The project's client from SIGUL_LIVE_PROJECTS. One literal key per
      # project, as zizmor reports a computed index as obfuscation.
      CONTAINER: >-
        ${{
          inputs.project == 'onap' &&
          fromJSON(vars.SIGUL_LIVE_PROJECTS || '{}').onap.container ||
          inputs.project == 'opendaylight' &&
          fromJSON(vars.SIGUL_LIVE_PROJECTS || '{}').opendaylight.container ||
          inputs.project == 'o-ran-sc' &&
          fromJSON(vars.SIGUL_LIVE_PROJECTS || '{}')['o-ran-sc'].container ||
          inputs.project == 'opensearch' &&
          fromJSON(vars.SIGUL_LIVE_PROJECTS || '{}').opensearch.container ||
          ''
        }}
    steps:
      # The firewall starts in a pre hook, before checkout. Keep its policy
      # inline: the organisation loader adds unrelated publishing endpoints.
      # Admit HTTPS checkout, the selected registry, and one approved bridge.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >-
            github.com:443
            ${{ env.CONTAINER == 'modern' &&
                'ghcr.io:443 pkg-containers.githubusercontent.com:443' || '' }}
            ${{ env.CONTAINER == 'legacy' &&
                'auth.docker.io:443 registry-1.docker.io:443' || '' }}
            ${{ env.CONTAINER == 'legacy' &&
                'production.cloudflare.docker.com:443' || '' }}
            ${{ env.CONTAINER == 'legacy' &&
                'production.cloudfront.docker.com:443' || '' }}
            ${{ env.CONTAINER == 'legacy' &&
                (env.BRIDGE_HOST ==
                  'sigul-bridge-yul.linuxfoundation.org' ||
                 env.BRIDGE_HOST ==
                  'sigul-bridge-us-west-2.linuxfoundation.org') &&
                format('{0}:44334', env.BRIDGE_HOST) || '' }}
            ${{ env.CONTAINER == 'modern' &&
                env.BRIDGE_HOST == 'sigul-bridge.opensearch.org' &&
                'sigul-bridge.opensearch.org:44334' || '' }}

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Require the expected public key"
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.SIGUL_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_KEY//[[:space:]]/}" ]; then
            echo "::error::Set SIGUL_PUBLIC_KEY before a non-dry signing run"
            exit 1
          fi

      - name: "Check the project configuration"
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          CONTAINER: ${{ env.CONTAINER }}
          HAVE_CREDENTIALS: ${{ secrets.SIGUL_CREDENTIALS != '' }}
          SIGUL_KEY: ${{ vars.SIGUL_KEY }}
        run: |
          set -euo pipefail
          missing=()
          case "${CONTAINER}" in
            legacy | modern) ;;
            *) missing+=("SIGUL_LIVE_PROJECTS container (legacy or modern)") ;;
          esac
          [ "${HAVE_CREDENTIALS}" = "true" ] ||
            missing+=("secret SIGUL_CREDENTIALS")
          [ -n "${SIGUL_KEY//[[:space:]]/}" ] ||
            missing+=("variable SIGUL_KEY")
          [ -n "${BRIDGE_HOST//[[:space:]]/}" ] ||
            missing+=("variable SIGUL_URI")
          if [ "${#missing[@]}" -gt 0 ]; then
            list="$(printf '%s, ' "${missing[@]}")"
            echo "::error::Project ${PROJECT} lacks: ${list%, }"
            exit 1
          fi

      - name: "Check the selected bridge"
        shell: bash
        env:
          CONTAINER: ${{ env.CONTAINER }}
        run: |
          set -euo pipefail
          case "${CONTAINER}:${BRIDGE_HOST}" in
            legacy:sigul-bridge-yul.linuxfoundation.org | \
            legacy:sigul-bridge-us-west-2.linuxfoundation.org | \
            modern:sigul-bridge.opensearch.org) ;;
            *)
              echo "::error::SIGUL_URI does not match the selected client"
              exit 1
              ;;
          esac

      # Interim workaround for lfreleng-actions/sigul-docker-k8s#102, until
      # lfreleng-actions/sigul-sign-action#32 pins inside the action.
      - name: "Pin the bridge address"
        id: pin
        shell: bash
        env:
          BRIDGE_PORT: "44334"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, socket, sys
          output = os.environ["GITHUB_OUTPUT"]
          host = os.environ["BRIDGE_HOST"]
          port = int(os.environ["BRIDGE_PORT"])
          try:
              found = socket.getaddrinfo(
                  host, port, socket.AF_INET, socket.SOCK_STREAM)
          except OSError as error:
              sys.exit(f"::error::Cannot resolve {host}: {error}")
          addresses = list(dict.fromkeys(entry[4][0] for entry in found))
          for number, address in enumerate(addresses, 1):
              try:
                  socket.create_connection((address, port), timeout=5).close()
              except OSError:
                  continue
              with open(output, "a", encoding="utf-8") as out:
                  out.write(f"address={address}\n")
              print(f"::notice::Pinned {host} to {address} ({number} of "
                    f"{len(addresses)} addresses) for this run")
              break
          else:
              tried = ", ".join(addresses) or "none"
              sys.exit(f"::error::No address of {host} accepts connections "
                       f"on port {port}; tried {tried}")
          PY

      - name: "Make something to sign"
        id: target
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${OPERATION}" = "sign-data" ]; then
            mkdir -p live-signing
            printf 'sigul-sign-action live test\nrun %s\ncommit %s\n' \
              "${RUN_ID}" "${SHA}" > live-signing/payload.txt
            echo "object=live-signing/payload.txt" >> "$GITHUB_OUTPUT"
          else
            # A local tag only: push-tag is off below, so nothing
            # leaves the runner.
            tag="sigul-live-test-${RUN_ID}"
            git -c user.name="sigul-sign-action" \
              -c user.email="releng@linuxfoundation.org" \
              -c tag.gpgSign=false \
              tag -a "${tag}" -m "Live signing test, run ${RUN_ID}"
            echo "object=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Unpack Sigul credentials"
        id: creds
        shell: bash
        env:
          SIGUL_CREDENTIALS: ${{ secrets.SIGUL_CREDENTIALS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, binascii, json, os, sys
          encoded = "".join(os.environ["SIGUL_CREDENTIALS"].split())
          try:
              doc = json.loads(base64.b64decode(encoded, validate=True))
          except (binascii.Error, ValueError):
              sys.exit("::error::SIGUL_CREDENTIALS is not base64 encoded JSON")
          if doc.get("version") != 1:
              sys.exit("::error::SIGUL_CREDENTIALS has an unsupported version")
          lines = []
          for key in ("config", "password", "pki"):
              value = doc.get(key)
              if (not isinstance(value, str) or not value
                      or "\n" in value or "\r" in value):
                  sys.exit(f"::error::SIGUL_CREDENTIALS.{key} "
                           "must be one non-empty line")
              # The runner percent-decodes command data: escape it, or a
              # value holding "%25" would register a different string as
              # its mask.
              print("::add-mask::" + value.replace("%", "%25"))
              lines.append(f"{key}={value}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: "Sign with Sigul"
        id: sign
        uses: $/
        with:
          container: ${{ env.CONTAINER }}
          allow-legacy: ${{ env.CONTAINER == 'legacy' }}
          sign-type: ${{ inputs.operation }}
          sign-object: ${{ steps.target.outputs.object }}
          push-tag: "false"
          dry-run: ${{ inputs.dry-run }}
          sigul-key-name: ${{ vars.SIGUL_KEY }}
          sigul-conf: ${{ steps.creds.outputs.config }}
          sigul-pass: ${{ steps.creds.outputs.password }}
          sigul-pki: ${{ steps.creds.outputs.pki }}
          sigul-ip: ${{ steps.pin.outputs.address }}
          sigul-uri: ${{ env.BRIDGE_HOST }}
          sigul-hosts-entry: "true"
          expected-bridge: ${{ format('{0}:44334', env.BRIDGE_HOST) }}

      - name: "Verify the signature"
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          OBJECT: ${{ steps.target.outputs.object }}
          PUBLIC_KEY: ${{ vars.SIGUL_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_KEY//[[:space:]]/}" ]; then
            echo "::error::SIGUL_PUBLIC_KEY is required to verify the signature"
            exit 1
          fi
          if [ "${OPERATION}" = "sign-git-tag" ]; then
            git cat-file tag "refs/tags/${OBJECT}" |
              grep -q "BEGIN PGP SIGNATURE" ||
              { echo "::error::the tag carries no signature"; exit 1; }
          fi

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d /tmp/verify.XXXXXX)"
          printf '%s\n' "${PUBLIC_KEY}" | gpg --batch --quiet --import
          if [ "${OPERATION}" = "sign-data" ]; then
            gpg --batch --verify "${OBJECT}.asc" "${OBJECT}"
            # Only after verification, and indented rather than fenced:
            # armour headers sit outside the signed data, so a fence could
            # still be closed from inside a verified file. Markdown also
            # ends a line at a bare CR, so split those before indenting.
            {
              printf '### Signature\n\n'
              tr '\r' '\n' < "${OBJECT}.asc" | sed 's/^/    /'
              printf '\n'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git verify-tag "${OBJECT}"
          fi
          echo "Signature verified against SIGUL_PUBLIC_KEY ✅" |
            tee -a "$GITHUB_STEP_SUMMARY"
